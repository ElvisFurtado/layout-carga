<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Layout de Carga</title>
    <title>Layout de Carga</title>
</head>
<body>
    <div class="funx_layout_principal">
        <div>
            <h3 style="text-align: center;">Blocos das Lojas</h3>
            <div class="funx_painel_lojas" id="funx_area_origem">
                <div id="funx_loja_1" class="funx_bloco_carga" draggable="true">505</div>
                <div id="funx_loja_2" class="funx_bloco_carga" draggable="true">Greenberg</div>
                <div id="funx_loja_3" class="funx_bloco_carga" draggable="true">Casa</div>
                <div id="funx_loja_4" class="funx_bloco_carga" draggable="true">Loja Gon</div>
                <div id="funx_loja_5" class="funx_bloco_carga" draggable="true">Costureiras</div>
                <div id="funx_loja_6" class="funx_bloco_carga" draggable="true">Rolos</div>
            </div>
            <button id="funx_btn_limpar" class="funx_botao_limpar">Limpar Tudo</button>
            <button id="funx_btn_whatsapp" class="funx_botao_whatsapp">Enviar WhatsApp</button>
        </div>

        <div class="funx_area_caminhao">
            <h3 style="text-align: center;">Layout de Carga</h3>
            <div id="funx_bau_caminhao">
                <div class="funx_indicador_fundo">⬆ Fundo (Cabine) ⬆</div>
                <div style="flex-grow: 1;"></div>
                <div class="funx_indicador_porta">⬇ Porta do Baú ⬇</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
