<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout de Carga</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div class="funx_layout_principal">
        <div class="funx_container_lateral">
            <h3 style="text-align: center;">Blocos das Lojas</h3>
            <div class="funx_painel_lojas" id="funx_area_origem">
                <div id="funx_loja_1" class="funx_bloco_carga">
                    <span class="funx_nome_loja">505</span>
                    <input type="number" class="funx_qtd_caixas" placeholder="Qtd caixas" min="1">
                </div>
                <div id="funx_loja_2" class="funx_bloco_carga">
                    <span class="funx_nome_loja">Greenberg</span>
                    <input type="number" class="funx_qtd_caixas" placeholder="Qtd caixas" min="1">
                </div>
                <div id="funx_loja_3" class="funx_bloco_carga">
                    <span class="funx_nome_loja">Casa</span>
                    <input type="number" class="funx_qtd_caixas" placeholder="Qtd caixas" min="1">
                </div>
                <div id="funx_loja_4" class="funx_bloco_carga">
                    <span class="funx_nome_loja">Loja Gon</span>
                    <input type="number" class="funx_qtd_caixas" placeholder="Qtd caixas" min="1">
                </div>
                <div id="funx_loja_5" class="funx_bloco_carga">
                    <span class="funx_nome_loja">Costureiras</span>
                    <input type="number" class="funx_qtd_caixas" placeholder="Qtd caixas" min="1">
                </div>
                <div id="funx_loja_6" class="funx_bloco_carga">
                    <span class="funx_nome_loja">Rolos</span>
                    <input type="number" class="funx_qtd_caixas" placeholder="Qtd caixas" min="1">
                </div>
            </div>
            <button id="funx_btn_limpar" class="funx_botao_limpar">Limpar Tudo</button>
            <button id="funx_btn_whatsapp" class="funx_botao_whatsapp">Enviar WhatsApp</button>
        </div>

        <div class="funx_area_caminhao">
            <h3 style="text-align: center;">Layout de Carga</h3>
            <div id="funx_bau_caminhao">
                <div class="funx_indicador_fundo">⬆ Fundo (Cabine) ⬆</div>
                <div style="flex-grow: 1;"></div>
                <div class="funx_indicador_porta">⬇ Porta do Baú ⬇</div>
            </div>
        </div>
    </div>
    <script src="script.js?v=4"></script>
</body>
</html>
